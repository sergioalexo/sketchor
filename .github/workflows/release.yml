name: release

# Push a version tag (e.g. v0.7.0) to build the Windows installer and publish
# a GitHub Release. The build is signed with the updater keypair, and
# tauri-action attaches `latest.json` alongside the installer — that file is
# the endpoint the in-app updater polls, so an already-installed Sketchor can
# download, verify and install the new version by itself.
#
# Secrets required (already set on this repo):
#   TAURI_SIGNING_PRIVATE_KEY           minisign private key (updater signing)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty for this key)
#
# NOTE: pushing this file needs a token with the `workflow` scope
# (`gh auth refresh -s workflow`), or add it via the GitHub web UI.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/web
          tagName: ${{ github.ref_name }}
          releaseName: "Sketchor ${{ github.ref_name }}"
          releaseBody: |
            Installed already? Sketchor updates itself — **Check for updates**
            in the toolbar, or accept the prompt on start-up.

            First install: download the `.exe` below.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
