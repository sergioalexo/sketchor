[package]
name = "dxf-thumbnailer"
version = "0.1.0"
license = "AGPL-3.0-or-later"
edition = "2021"
description = "Windows Explorer thumbnail provider for DXF drawings and STEP/IGES models (Sketchor)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-core = "0.58"
# The DXF parser + fit-to-box projection, shared with the macOS Quick Look
# extension so previews match across platforms. See native/dxf-parse.
dxf-parse = { path = "../dxf-parse" }
# STEP wireframe fallback for models Sketchor hasn't rendered yet. See native/step-wire.
step-wire = { path = "../step-wire" }
# Sidecar previews: Sketchor writes %LOCALAPPDATA%/Sketchor/thumbs/<sha256>.png
# for every model it renders; the DLL hashes the file and decodes that PNG.
sha2 = "0.10"
png = "0.17"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
version = "0.58"
features = [
  "implement",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
